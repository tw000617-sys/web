<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>장송의 프리렌</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/jquery-4.0.0.min.js"></script>
    <script src="js/script.js"></script>
</head>

<body>
    <div class="navbar">
        <div class="nav-logo">
         <a href="#"><img src="assets/imges/flogo.png" alt=""></a>
        </div>
        <ul class="nav-links">
            <li><a href="world">세계관</a></li>
            <li><a href="characters">등장인물</a></li>
            <li><a href="animation">애니메이션</a></li>
            <li><a href="manga">만화</a></li>

        </ul>
        <div class="nav-sub"></div>
    </div>

    <div class="music-player">
    <button id="play-pause-btn" class="control-btn">
        <span class="icon-play">▶</span>
        </button>
    <audio id="main-audio" src="assets/audio/yorusika-sunny.mp3"></audio>
</div>
    </div>

    <div class="container">
        
        <aside class="char-list">
            <ul>
                    <li class="char-item" onclick="selectChar(this, 'Frieren')">
                        <img src="assets/imges/frierenface.png" alt="프리렌">
                    </li>
                    <li class="char-item" onclick="selectChar(this, 'Fern')">
                        <img src="assets/imges/fernface.png" alt="페른">
                    </li>
                    <li class="char-item" onclick="selectChar(this, 'Stark')">
                        <img src="assets/imges/starkface.png" alt="슈타르크">
            </ul>
        </aside>

        <main class="main-display" id="main-area" onclick="nextScene()">
            <div class="bg-layer" id="bg-layer"></div>
            <img src="assets/imges/frieren.png" class="char-img" id="char-img" alt="메인 캐릭터">

        </main>

        <section class="info-panel">
    
            <div class="char-info">
                <h2 id="char-name">프리렌｜Frieren</h2>
                <hr>
                <p id="char-story"></p>
            </div>
        </section>
    </div>
</body>

</html>
